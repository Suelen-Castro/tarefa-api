name: CI

# GATILHO: roda quando um Pull Request para a main é aberto, atualizado ou reaberto
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancela execuções antigas do mesmo PR quando chega um novo commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas (boa prática de segurança)
permissions:
  contents: read

jobs:
  # 1) ANÁLISE ESTÁTICA DE CÓDIGO (ESLint)
  lint:
    name: Analise estatica de codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 2) ANÁLISE DE FORMATAÇÃO (Prettier)
  format:
    name: Analise de formatacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # 3) ANÁLISE ESTÁTICA DE SEGURANÇA (CodeQL + npm audit)
  security:
    name: Analise estatica de seguranca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Verifica dependências com vulnerabilidades graves conhecidas
      - run: npm audit --omit=dev --audit-level=high

  # 4) BUILD (só roda se lint, format e security passarem)
  build:
    name: Build
    needs: [lint, format, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # 5) TESTE UNITÁRIO (rápido, sem banco de dados)
  unit-test:
    name: Teste unitario
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # 6) TESTE DE INTEGRAÇÃO (API + PostgreSQL real em container)
  integration-test:
    name: Teste de integracao
    needs: unit-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # 7) CRIAÇÃO DA IMAGEM DOCKER (só se tudo anterior passou)
  docker:
    name: Criacao da imagem Docker
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tarefas-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
